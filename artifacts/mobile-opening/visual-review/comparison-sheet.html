<!doctype html><html><head><meta charset="utf-8"><title>12-frame mobile comparison</title><style>*{box-sizing:border-box}body{width:840px;margin:0;padding:20px;background:#e8f0f6;color:#15354c;font:13px Arial}h1{font-size:22px;margin:0 0 10px}p{margin:6px 0 18px}h2{font-size:15px;margin:16px 0 8px}.row{display:grid;grid-template-columns:repeat(4,190px);gap:12px}figure{margin:0}img{width:190px;height:auto;display:block}figcaption{padding:6px 0}</style></head><body><h1>Actual mobile opening — 0s / 3s / 6s / 9s</h1><p>Centered cover crop. Original decoded MP4, production overlays. Faces/hands remain visible; outer silhouettes and arch are cropped.</p><main id="sheet"></main><script>for(const [w,h]of[[360,800],[390,844],[430,932]]){const section=document.createElement('section');section.innerHTML=`<h2>${w} × ${h}</h2><div class="row">${[0,3,6,9].map(t=>`<figure><img src="${w}-${t}s.png" alt="${w}x${h}, ${t}s"><figcaption>${t} seconds</figcaption></figure>`).join('')}</div>`;document.querySelector('#sheet').append(section);}</script></body></html>
