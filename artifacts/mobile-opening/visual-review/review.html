<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Actual video frame review</title><style>body{margin:0;background:#e6eef4;color:#13334b;font:14px Arial}header{padding:15px 20px}h1{font-size:20px;margin:0 0 8px}p{margin:6px 0}button{padding:9px 14px;margin:6px 6px 0 0;background:#112e47;color:white;border:0;cursor:pointer}main{padding:0 20px 20px}iframe{display:block;border:0}#status{display:inline-block;font-weight:bold;padding-left:10px}</style></head><body><header><h1>Actual MP4 — exact-frame mobile review</h1><p>Actual browser-decoded video, paused at exact timestamps for capture. Uses unchanged production cover CSS and overlays; live transition tested separately.</p><button data-size="360,800">360 × 800</button><button data-size="390,844">390 × 844</button><button data-size="430,932">430 × 932</button><br/><button data-time="0">0 seconds</button><button data-time="3">3 seconds</button><button data-time="6">6 seconds</button><button data-time="9">9 seconds</button><button data-position="47%">47% left</button><button data-position="50%">50% center</button><button data-position="53%">53% right</button><span id="status">Loading…</span></header><main><iframe title="Actual mobile video viewport" width="360" height="800" src="frame.html"></iframe></main><script>
const f=document.querySelector('iframe'),status=document.querySelector('#status');let current=0;
async function seek(t){status.textContent='Seeking…';const v=f.contentDocument.querySelector('video');if(v.readyState<2)await new Promise((r,j)=>{v.addEventListener('loadeddata',r,{once:true});v.addEventListener('error',j,{once:true});});v.pause();if(Math.abs(v.currentTime-t)>.001)await new Promise(r=>{v.addEventListener('seeked',r,{once:true});v.currentTime=t;});await new Promise(r=>f.contentWindow.requestAnimationFrame(()=>f.contentWindow.requestAnimationFrame(r)));current=t;status.textContent=`Ready: ${t.toFixed(3)} seconds`;}
f.onload=()=>seek(0).catch(()=>status.textContent='Media decode failed');for(const b of document.querySelectorAll('[data-time]'))b.onclick=()=>seek(Number(b.dataset.time));for(const b of document.querySelectorAll('[data-size]'))b.onclick=async()=>{[f.width,f.height]=b.dataset.size.split(',');await seek(current);};for(const b of document.querySelectorAll('[data-position]'))b.onclick=()=>{f.contentDocument.querySelector('video').style.objectPosition=b.dataset.position+' 50%';status.textContent='Position: '+b.dataset.position;};
</script></body></html>
