<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Local invitation performance sample</title><style>body{font:14px Arial;background:#eaf2f7;color:#16344b;display:flex;gap:30px;padding:20px}iframe{border:0;width:375px;height:667px}pre{white-space:pre-wrap;max-width:620px}</style></head><body><iframe title="Local 375 by 667 invitation sample" src="/"></iframe><div><h1>Local lab sample</h1><p>Not field Core Web Vitals. Includes an iframe-sized invitation load on this machine. Event durations are diagnostic only, not an INP score.</p><pre id="metrics">Loading…</pre></div><script>const frame=document.querySelector('iframe'),output=document.querySelector('#metrics');frame.onload=()=>{const w=frame.contentWindow,data={viewport:'375x667',lcpMs:null,cls:0,eventDurationsMs:[],scope:'local iframe navigation; no throttling; not field metrics'};const render=()=>output.textContent=JSON.stringify(data,null,2);if(w.PerformanceObserver){try{new w.PerformanceObserver(list=>{for(const e of list.getEntries())data.lcpMs=Math.round(e.startTime);render();}).observe({type:'largest-contentful-paint',buffered:true});new w.PerformanceObserver(list=>{for(const e of list.getEntries())if(!e.hadRecentInput)data.cls+=e.value;data.cls=Number(data.cls.toFixed(5));render();}).observe({type:'layout-shift',buffered:true});new w.PerformanceObserver(list=>{for(const e of list.getEntries())if(e.duration)data.eventDurationsMs.push(e.duration);render();}).observe({type:'event',buffered:true,durationThreshold:16});}catch(e){data.observerNote=e.message;}}render();};</script></body></html>
